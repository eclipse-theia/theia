name: Publish packages to NPM

permissions:
  id-token: write
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type: "minor" increments the minor version (e.g., 1.53.0 → 1.54.0), "patch" increments the patch version (e.g., 1.54.0 → 1.54.1), "next" publishes a pre-release version (e.g., 1.55.0-next.17).'
        required: true
        type: choice
        options:
          - 'minor'
          - 'patch'
          - 'next'
        default: 'next'
      is_patch_to_previous:
        description: 'Patch a previous release branch: Enable this to publish a patch to an older version branch (e.g., patching 1.53.x when 1.54.x is the latest). Must be used with release_type="patch". Leave disabled for publishing to the current latest or next version.'
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "0 0 * * 1-5" # Publish next version (default) every weekday at midnight

jobs:
  publish:
    name: Perform Publishing
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      RELEASE_TYPE: ${{ inputs.release_type || 'next' }}
      IS_PATCH_TO_PREVIOUS: ${{ inputs.is_patch_to_previous || false }}
      # GCC before 13 (ubuntu-22.04 ships 11 and 12) cannot compile the V8 headers of Electron 44
      CC: clang-15
      CXX: clang++-15
    steps:
      - name: Validate Inputs
        shell: bash
        run: |
          if [[ "${{ env.IS_PATCH_TO_PREVIOUS }}" == "true" && "${{ env.RELEASE_TYPE }}" != "patch" ]]; then
            echo "Error: When 'is_patch_to_previous' is enabled, release_type must be 'patch'"
            exit 1
          fi
          echo "Input validation passed"
          echo "Release type: ${{ env.RELEASE_TYPE }}"
          echo "Is patch to previous: ${{ env.IS_PATCH_TO_PREVIOUS }}"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # To fetch all history for all branches and tags.
          # Required for lerna to determine the version of the next package.
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install and build
        shell: bash
        run: |
          npm ci
          npm run build
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # https://github.com/microsoft/vscode-ripgrep/issues/9

      # The output of the publish steps is kept in `lerna-publish.log`, the PR step below uses it
      # to tell whether the registry accepted any package at all. On success, lerna also writes the
      # exact versions it published to `lerna-publish-summary.json`, which the verification checks.
      # lerna resolves the summary path against the working directory, so it is written there and
      # moved out of the repository before the PR step commits the working tree.
      - name: Publish to NPM (Latest)
        id: publish-latest
        # We only publish minor or patch releases for the current version as latest, never for older patches or next versions.
        if: ${{ (env.RELEASE_TYPE == 'patch' || env.RELEASE_TYPE == 'minor') && env.IS_PATCH_TO_PREVIOUS == 'false' }}
        shell: bash
        run: |
          npm run publish:latest -- ${{ env.RELEASE_TYPE }} --summary-file lerna-publish-summary.json 2>&1 | tee -a "$RUNNER_TEMP/lerna-publish.log"
          # lerna writes no summary when there was nothing to publish, e.g. on a re-run
          if [ -f lerna-publish-summary.json ]; then mv lerna-publish-summary.json "$RUNNER_TEMP/"; fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish to NPM (Patch - To Previous Version)
        id: publish-patch
        if: ${{ env.RELEASE_TYPE == 'patch' && env.IS_PATCH_TO_PREVIOUS == 'true' }}
        shell: bash
        run: |
          npm run publish:patch -- ${{ env.RELEASE_TYPE }} --summary-file lerna-publish-summary.json 2>&1 | tee -a "$RUNNER_TEMP/lerna-publish.log"
          # lerna writes no summary when there was nothing to publish, e.g. on a re-run
          if [ -f lerna-publish-summary.json ]; then mv lerna-publish-summary.json "$RUNNER_TEMP/"; fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Publish to NPM (Next)
        id: publish-next
        if: ${{ env.RELEASE_TYPE == 'next' }}
        shell: bash
        run: |
          npm run publish:next -- --summary-file lerna-publish-summary.json
          # lerna writes no summary when there was nothing to publish, e.g. on a re-run
          if [ -f lerna-publish-summary.json ]; then mv lerna-publish-summary.json "$RUNNER_TEMP/"; fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # Also runs when the publish failed part way, e.g. on a Sigstore error: every version the
      # registry accepted is final, so the version bump in the PR is right either way.
      - name: Submit PR for package updates
        if: ${{ !cancelled() && env.RELEASE_TYPE != 'next' && (steps.publish-latest.outcome != 'skipped' || steps.publish-patch.outcome != 'skipped') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_FAILED: ${{ steps.publish-latest.outcome == 'failure' || steps.publish-patch.outcome == 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # A version bump is only worth a PR if the registry accepted at least one package of it.
          if ! grep -q 'lerna success published @' "$RUNNER_TEMP/lerna-publish.log"; then
            echo "::warning::lerna did not publish any package, not submitting a PR for package updates"
            exit 0
          fi

          # Configure git
          git config --local user.email "eclipse-theia-bot@eclipse.org"
          git config --local user.name "eclipse-theia-bot"

          # Get the version from lerna.json after publishing
          VERSION=$(node -p "require('./lerna.json').version")
          echo "Lerna Version: $VERSION"

          # A successful publish reverts every package.json but keeps lerna.json and package-lock.json
          # bumped. Re-apply the version so that the PR updates every package, which also regenerates
          # packages/core/README.md. Keep the lockfile of the publish: lerna rewrites it as well and
          # drops fields such as `hasInstallScript` on the way.
          cp package-lock.json "$RUNNER_TEMP/package-lock.json"
          npx lerna version "$VERSION" --exact --force-publish --no-git-tag-version --no-push --yes
          cp "$RUNNER_TEMP/package-lock.json" package-lock.json

          # First commit: Update packages/core/README.md
          if git diff --name-only | grep -q "packages/core/README.md"; then
            git add packages/core/README.md
            git commit -m "core: update re-exports for v${VERSION}"
            echo "First commit created for packages/core/README.md"
          else
            echo "No changes to packages/core/README.md"
          fi

          # Second commit: Add all other changes
          git add .
          if git diff --staged --quiet; then
            echo "No other changes to commit"
          else
            git commit -m "v${VERSION}"
            echo "Second commit created for remaining changes"
          fi

          # Submit PR
          if git log origin/${{ github.ref_name }}..HEAD | grep -q "commit"; then
            # Define PR body
            PR_BODY="Automated package updates for release v${VERSION}
            
            To complete the release:
            - Check that all package.json files, lerna.json and package-lock.json are updated to the published version
            - Amend the commits with your author details (to ensure the ECA check passes)
            - Keep the commits split (the re-export commit on the readme needs to be separate)
            - Force push the branch
            - Verify that all checks pass, and then \`rebase and merge\`
            - Check the [publish workflow run](${RUN_URL}) summary for packages npm has not released yet"
            if [ "$PUBLISH_FAILED" = "true" ]; then
              PR_BODY="${PR_BODY}
            - **The publish failed part way.** Publish the missing packages (see the workflow run) with \`npx lerna publish from-package\` before merging"
            fi
            
            # Create a new branch for the PR
            BRANCH_NAME="${{ github.ref_name }}-package-updates"
            git checkout -b "$BRANCH_NAME"
            git push origin "$BRANCH_NAME"

            # Create PR using GitHub CLI
            gh pr create \
              --title "Release v${VERSION} - Package updates" \
              --body "$PR_BODY" \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH_NAME"

            echo "PR created for branch $BRANCH_NAME"
          else
            echo "No commits to push"
          fi

      # Informational only, and after the PR so that the package updates do not depend on it.
      # A failed upload already fails the publish step. Once lerna reports a package as published,
      # the registry has accepted it, and npm only has to finish its malware scan before releasing
      # it, which can take more than fifteen minutes. The check waits for that and reports
      # packages that are still not available as a warning, since nothing is left to do but wait.
      # A canary publish that did not complete has no summary and no version to check against.
      - name: Verify NPM publication
        if: ${{ !cancelled() && (steps.publish-latest.outcome != 'skipped' || steps.publish-patch.outcome != 'skipped' || steps.publish-next.outcome == 'success') }}
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ env.RELEASE_TYPE }}" = "next" ] && [ ! -f "$RUNNER_TEMP/lerna-publish-summary.json" ]; then
            echo "lerna published no canary versions, nothing to check"
            exit 0
          fi
          npm run publish:check -- --summary-file "$RUNNER_TEMP/lerna-publish-summary.json"
